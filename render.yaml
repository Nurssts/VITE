services:
  - type: web
    name: vite-biobuzz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FTC_API_USERNAME
        sync: false
      - key: FTC_API_TOKEN
        sync: false
      - key: TOA_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://nurssts.github.io
